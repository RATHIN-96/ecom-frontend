
<div class="container-fluid admin-dashboard">

    <!-- Dashboard Header -->
    <div class="dashboard-header d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold theme-text mb-0">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </h2>

        <!-- Theme Toggle -->
        <!-- <button
            type="button"
            class="admin-theme-toggle"
            (click)="toggleTheme()">

            <i
                class="bi"
                [ngClass]="themeService.isDarkMode()
                    ? 'bi-sun-fill'
                    : 'bi-moon-stars-fill'">
            </i>

            {{ themeService.isDarkMode()
                ? 'Light Mode'
                : 'Dark Mode' }}

        </button> -->

    </div>


    <!-- Dashboard Statistics -->
    <div class="row g-4">

        <!-- Categories -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card bg-primary">

                <div class="card-body">

                    <h5>
                        <i class="bi bi-grid-fill"></i>
                        Categories
                    </h5>

                    <h2>{{ dashboard.total_categories }}</h2>

                    <p>Total Categories</p>

                </div>

            </div>

        </div>


        <!-- Products -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card bg-success">

                <div class="card-body">

                    <h5>
                        <i class="bi bi-box-seam"></i>
                        Products
                    </h5>

                    <h2>{{ dashboard.total_products }}</h2>

                    <p>Total Products</p>

                </div>

            </div>

        </div>


        <!-- Users -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card bg-warning">

                <div class="card-body">

                    <h5>
                        <i class="bi bi-people-fill"></i>
                        Users
                    </h5>

                    <h2>{{ dashboard.total_users }}</h2>

                    <p>Total Users</p>

                </div>

            </div>

        </div>


        <!-- Orders -->
        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card bg-danger">

                <div class="card-body">

                    <h5>
                        <i class="bi bi-cart-check-fill"></i>
                        Orders
                    </h5>

                    <h2>{{ dashboard.total_orders }}</h2>

                    <p>Total Orders</p>

                </div>

            </div>

        </div>

    </div>


    <!-- Quick Actions -->
    <div class="row mt-5 g-4">

        <div class="col-lg-6">

            <div class="card shadow-sm admin-action-card">

                <div class="card-body">

                    <h4 class="theme-text">
                        <i class="bi bi-lightning-charge-fill"></i>
                        Quick Actions
                    </h4>

                    <hr>

                    <div class="d-flex flex-wrap gap-2">

                        <a
                            routerLink="/admin/categories"
                            class="btn btn-primary">

                            <i class="bi bi-plus-circle"></i>
                            Add Category

                        </a>

                        <a
                            routerLink="/admin/products"
                            class="btn btn-success">

                            <i class="bi bi-plus-circle"></i>
                            Add Product

                        </a>

                        <a
                            routerLink="/admin/orders"
                            class="btn btn-warning">

                            <i class="bi bi-box-seam"></i>
                            Manage Orders

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
