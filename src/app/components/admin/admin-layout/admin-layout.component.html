
<div class="admin-wrapper">

  <!-- Mobile Header -->

  <div class="mobile-header d-lg-none">

    <button
      class="btn btn-dark"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#adminSidebar">

      <i class="bi bi-list"></i>

    </button>

    <h5 class="m-0 fw-bold">VELORA ADMIN</h5>

    <!-- Mobile Theme Toggle -->

    <button
      class="admin-layout-theme-btn"
      type="button"
      (click)="toggleTheme()">

      <i
        class="bi"
        [ngClass]="themeService.isDarkMode()
          ? 'bi-sun-fill'
          : 'bi-moon-stars-fill'">
      </i>

    </button>

  </div>


  <!-- Desktop Sidebar -->

  <aside class="sidebar d-none d-lg-block">

    <h3 class="logo">
      VELORA ADMIN
    </h3>

    <ul>

      <li>
        <a routerLink="/admin">
          <i class="bi bi-speedometer2"></i>
          Dashboard
        </a>
      </li>

      <li>
        <a routerLink="/admin/categories">
          <i class="bi bi-grid"></i>
          Categories
        </a>
      </li>

      <li>
        <a routerLink="/admin/products">
          <i class="bi bi-box-seam"></i>
          Products
        </a>
      </li>

      <li>
        <a routerLink="/admin/users">
          <i class="bi bi-people"></i>
          Users
        </a>
      </li>

      <li>
        <a routerLink="/admin/orders">
          <i class="bi bi-bag-check"></i>
          Orders
        </a>
      </li>

    </ul>

    <!-- Desktop Theme Toggle -->

    <div class="sidebar-theme">

      <button
        type="button"
        class="admin-layout-theme-btn"
        (click)="toggleTheme()">

        <i
          class="bi"
          [ngClass]="themeService.isDarkMode()
            ? 'bi-sun-fill'
            : 'bi-moon-stars-fill'">
        </i>

        {{ themeService.isDarkMode()
          ? 'Light Mode'
          : 'Dark Mode' }}

      </button>

    </div>

    <!-- Logout -->

    <ul class="sidebar-bottom">

      <li class="logout">

        <a
          href="javascript:void(0)"
          (click)="logout()">

          <i class="bi bi-box-arrow-right"></i>
          Logout

        </a>

      </li>

    </ul>

  </aside>


  <!-- Mobile Sidebar -->

  <div
    class="offcanvas offcanvas-start admin-offcanvas"
    tabindex="-1"
    id="adminSidebar">

    <div class="offcanvas-header">

      <h5 class="fw-bold">
        VELORA ADMIN
      </h5>

      <button
        class="btn-close"
        data-bs-dismiss="offcanvas">
      </button>

    </div>

    <div class="offcanvas-body">

      <ul class="list-unstyled">

        <li class="mb-3">
          <a routerLink="/admin" data-bs-dismiss="offcanvas">
            <i class="bi bi-speedometer2"></i>
            Dashboard
          </a>
        </li>

        <li class="mb-3">
          <a routerLink="/admin/categories" data-bs-dismiss="offcanvas">
            <i class="bi bi-grid"></i>
            Categories
          </a>
        </li>

        <li class="mb-3">
          <a routerLink="/admin/products" data-bs-dismiss="offcanvas">
            <i class="bi bi-box-seam"></i>
            Products
          </a>
        </li>

        <li class="mb-3">
          <a routerLink="/admin/users" data-bs-dismiss="offcanvas">
            <i class="bi bi-people"></i>
            Users
          </a>
        </li>

        <li class="mb-3">
          <a routerLink="/admin/orders" data-bs-dismiss="offcanvas">
            <i class="bi bi-bag-check"></i>
            Orders
          </a>
        </li>

      </ul>

      <!-- Mobile Theme Toggle -->

      <div class="mobile-sidebar-theme">

        <button
          type="button"
          class="admin-layout-theme-btn"
          (click)="toggleTheme()">

          <i
            class="bi"
            [ngClass]="themeService.isDarkMode()
              ? 'bi-sun-fill'
              : 'bi-moon-stars-fill'">
          </i>

          {{ themeService.isDarkMode()
            ? 'Light Mode'
            : 'Dark Mode' }}

        </button>

      </div>

      <!-- Logout -->

      <ul class="list-unstyled">

        <li class="logout">

          <a
            href="javascript:void(0)"
            (click)="logout()">

            <i class="bi bi-box-arrow-right"></i>
            Logout

          </a>

        </li>

      </ul>

    </div>

  </div>


  <!-- Main Content -->

  <main class="content">

    <router-outlet></router-outlet>

  </main>

</div>
