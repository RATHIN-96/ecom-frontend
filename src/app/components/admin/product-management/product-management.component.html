<div class="container-fluid">

    <!-- Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

      <h2 class="fw-bold mb-3 mb-md-0">
      📦 Product Management
      </h2>

    </div>

    <!-- Product Form -->

    <div class="card shadow-sm mb-4">

      <div class="card-body">

        <div class="row g-3">

          <!-- Product Name -->

          <div class="col-12 col-md-6">

             <label class="form-label">
             Product Name
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="productName">

          </div>

          <!-- Category -->

          <div class="col-12 col-md-6">

            <label class="form-label">
              Category
            </label>

            <select
              class="form-select"
              [(ngModel)]="categoryId">

              <option value="">
               Select Category
              </option>

              <option
                *ngFor="let category of categories"
                [value]="category.id">

                {{ category.name }}

              </option>

            </select>

          </div>

          <!-- Price -->

          <div class="col-12 col-md-6">

            <label class="form-label">
             Price
            </label>

            <input
              type="number"
              class="form-control"
              [(ngModel)]="price">

          </div>

          <!-- Discount -->

          <div class="col-12 col-md-6">

            <label class="form-label">
              Discount (%)
            </label>

            <input
             type="number"
              class="form-control"
              [(ngModel)]="discountPercentage"
              min="0"
              max="90"
              placeholder="0">

          </div>

          <!-- Has Size -->

          <div class="col-12">

            <div class="form-check">

              <input
                class="form-check-input"
                type="checkbox"
                id="hasSize"
                [(ngModel)]="hasSize">

              <label
                class="form-check-label fw-bold"
               for="hasSize">

                This Product Has Sizes

              </label>

            </div>

          </div>

          <!-- Available Sizes -->

          <div
            class="col-12"
            *ngIf="hasSize">

            <label class="form-label fw-bold">

              Available Sizes

            </label>

            <div class="d-flex flex-wrap gap-3">

              <div
                class="form-check"
                *ngFor="let size of sizes">

                <input
                  class="form-check-input"
                  type="checkbox"
                  [checked]="selectedSizes.includes(size.id)"
                  (change)="toggleSize(size.id, $event)">

                <label class="form-check-label">

                  {{ size.name }}

                </label>

              </div>

            </div>

          </div>

          <!-- Product Image -->

          <div class="col-12 col-md-6">

            <label class="form-label">
             Product Image
            </label>

            <input
              type="file"
              class="form-control"
              (change)="onImageSelected($event)">

          </div>

          <!-- Description -->

          <div class="col-12">

            <label class="form-label">
            Description
            </label>

            <textarea
              rows="4"
              class="form-control"
              [(ngModel)]="description">
            </textarea>

          </div>

          <!-- Save -->

          <div class="col-12">

            <button
              class="btn btn-primary px-4"
              (click)="saveProduct()">

              {{ buttonText }}

            </button>

          </div>

        </div>

      </div>

    </div>
      <!-- Product List -->

  <div class="card shadow-sm">

    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

          <thead class="table-dark">

            <tr>

              <th>Image</th>

              <th>Name</th>

              <th>Category</th>

              <th>Sizes</th>

              <th>Price</th>

              <th>Discount</th>

              <th>Final Price</th>

              <th>Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let product of products">

              <!-- Image -->

              <td>

                <img
                  [src]="product.image"
                  class="product-image"
                  alt="Product">

              </td>

              <!-- Name -->

              <td class="fw-semibold">

                {{ product.name }}

              </td>

              <!-- Category -->

              <td>

                {{ product.category?.name }}

              </td>

              <!-- Sizes -->

              <td>

                <ng-container *ngIf="product.has_size; else noSize">

                  <span
                    class="badge bg-primary me-1 mb-1"
                    *ngFor="let size of product.sizes">

                    {{ size.name }}

                  </span>

                </ng-container>

                <ng-template #noSize>

                  <span class="text-muted">

                    -

                  </span>

                </ng-template>

              </td>

              <!-- Price -->

              <td>

                ₹{{ product.price }}

              </td>

              <!-- Discount -->

              <td>

                <span
                  class="badge bg-danger"
                  *ngIf="product.discount_percentage > 0">

                  {{ product.discount_percentage }}% OFF

                </span>

                <span
                  *ngIf="product.discount_percentage == 0">

                  -

                </span>

              </td>

              <!-- Final Price -->

              <td>

                <strong class="text-success">

                  ₹{{ product.discounted_price }}

                </strong>

              </td>

              <!-- Actions -->

              <td>

                <button
                  class="btn btn-warning btn-sm me-2"
                  (click)="editProduct(product)">

                  <i class="bi bi-pencil-square"></i>

                </button>

                <button
                  class="btn btn-danger btn-sm"
                  (click)="deleteProduct(product.id)">

                  <i class="bi bi-trash"></i>

                </button>

              </td>

            </tr>

            <!-- Empty -->

            <tr *ngIf="products.length === 0">

              <td colspan="8" class="text-center py-5">

                <h5 class="text-muted">

                  No Products Found

                </h5>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
