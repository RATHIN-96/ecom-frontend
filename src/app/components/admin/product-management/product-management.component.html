<div class="container-fluid">

  <!-- Heading -->

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

    <h2 class="fw-bold mb-3 mb-md-0">
      📦 Product Management
    </h2>

  </div>

  <!-- Product Form -->

  <div class="card shadow-sm mb-4">

    <div class="card-body">

      <div class="row g-3">

        <!-- Product Name -->

        <div class="col-12 col-md-6">

          <label class="form-label">
            Product Name
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="productName">

        </div>

        <!-- Category -->

        <div class="col-12 col-md-6">

          <label class="form-label">
            Category
          </label>

          <select
            class="form-select"
            [(ngModel)]="categoryId">

            <option value="">
              Select Category
            </option>

            <option
              *ngFor="let category of categories"
              [value]="category.id">

              {{ category.name }}

            </option>

          </select>

        </div>

        <!-- Price -->

        <div class="col-12 col-md-6">

          <label class="form-label">
            Price
          </label>

          <input
            type="number"
            class="form-control"
            [(ngModel)]="price">

        </div>

        <!-- Discount -->

        <div class="col-12 col-md-6">

          <label class="form-label">
            Discount (%)
          </label>

          <input
            type="number"
            class="form-control"
            [(ngModel)]="discountPercentage"
            min="0"
            max="90"
            placeholder="0">

        </div>

        <!-- Image -->

        <div class="col-12 col-md-6">

          <label class="form-label">
            Product Image
          </label>

          <input
            type="file"
            class="form-control"
            (change)="onImageSelected($event)">

        </div>

        <!-- Description -->

        <div class="col-12">

          <label class="form-label">
            Description
          </label>

          <textarea
            rows="4"
            class="form-control"
            [(ngModel)]="description">
          </textarea>

        </div>

        <!-- Save -->

        <div class="col-12">

          <button
            class="btn btn-primary"
            (click)="saveProduct()">

            {{ buttonText }}

          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- Product List -->

  <div class="card shadow-sm">

    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

          <thead class="table-dark">

            <tr>

              <th>Image</th>

              <th>Name</th>

              <th>Category</th>

              <th>Price</th>

              <th>Discount</th>

              <th>Final Price</th>

              <th>Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let product of products">

              <!-- Image -->

              <td>

                <img
                  [src]="product.image"
                  class="product-image"
                  alt="Product">

              </td>

              <!-- Name -->

              <td class="product-name">

                {{ product.name }}

              </td>

              <!-- Category -->

              <td>

                {{ product.category?.name }}

              </td>

              <!-- Price -->

              <td>

                ₹{{ product.price }}

              </td>

              <!-- Discount -->

              <td>

                <span
                  class="badge bg-danger"
                  *ngIf="product.discount_percentage > 0">

                  {{ product.discount_percentage }}% OFF

                </span>

                <span
                  *ngIf="product.discount_percentage == 0">

                  -

                </span>

              </td>

              <!-- Final Price -->

              <td>

                <strong class="text-success">

                  ₹{{ product.discounted_price }}

                </strong>

              </td>

              <!-- Actions -->

              <td class="action-column">

                <button
                  class="btn btn-warning btn-sm me-2"
                  (click)="editProduct(product)">

                  <i class="bi bi-pencil-square"></i>

                </button>

                <button
                  class="btn btn-danger btn-sm"
                  (click)="deleteProduct(product.id)">

                  <i class="bi bi-trash"></i>

                </button>

              </td>

            </tr>

            <tr *ngIf="products.length === 0">

              <td colspan="7" class="text-center py-4">

                No Products Found

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
