<div class="container-fluid">

    <!-- Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

        <h2 class="fw-bold mb-3 mb-md-0">

            👥 User Management

        </h2>

    </div>

    <!-- Search -->

    <div class="row mb-4">

        <div class="col-12 col-md-4">

            <input
                type="text"
                class="form-control"
                placeholder="🔍 Search User..."
                [(ngModel)]="searchText">

        </div>

    </div>

    <!-- User Table -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Username</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Role</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let user of filteredUsers">

                            <!-- ID -->

                            <td>

                                {{ user.id }}

                            </td>

                            <!-- Username -->

                            <td>

                                {{ user.username }}

                            </td>

                            <!-- Name -->

                            <td>

                                {{ user.first_name }}
                                {{ user.last_name }}

                            </td>

                            <!-- Email -->

                            <td>

                                {{ user.email }}

                            </td>

                            <!-- Role -->

                            <td>

                                <span
                                    *ngIf="user.is_staff"
                                    class="badge bg-primary">

                                    Admin

                                </span>

                                <span
                                    *ngIf="!user.is_staff"
                                    class="badge bg-info">

                                    User

                                </span>

                            </td>

                            <!-- Status -->

                            <td>

                                <span
                                    *ngIf="user.is_active"
                                    class="badge bg-success">

                                    Active

                                </span>

                                <span
                                    *ngIf="!user.is_active"
                                    class="badge bg-danger">

                                    Blocked

                                </span>

                            </td>

                            <!-- Action -->

                            <td>

                                <ng-container *ngIf="!user.is_staff">

                                    <button
                                        *ngIf="user.is_active"
                                        class="btn btn-dark btn-sm"
                                        (click)="toggleStatus(user)">

                                        🚫 Block

                                    </button>

                                    <button
                                        *ngIf="!user.is_active"
                                        class="btn btn-warning btn-sm"
                                        (click)="toggleStatus(user)">

                                        ✅ Unblock

                                    </button>

                                </ng-container>

                            </td>

                        </tr>

                        <tr *ngIf="filteredUsers.length === 0">

                            <td
                                colspan="7"
                                class="text-center py-4">

                                No Users Found

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
