<div class="container mt-5">

  <div class="card shadow p-4">

    <h2 class="mb-4">
      Checkout
    </h2>

    <!-- Name -->

    <div class="mb-3">

      <label class="form-label">
        Name
      </label>

      <input
        class="form-control"
        [(ngModel)]="order.name">

    </div>

    <!-- Address -->

    <div class="mb-3">

      <label class="form-label">
        Address
      </label>

      <textarea
        class="form-control"
        rows="3"
        [(ngModel)]="order.address">
      </textarea>

    </div>

    <!-- Phone -->

    <div class="mb-3">

      <label class="form-label">
        Phone
      </label>

      <input
        class="form-control"
        [(ngModel)]="order.phone">

    </div>

    <!-- Payment Method -->

    <div class="mb-4">

      <label class="form-label fw-bold">

        Payment Method

      </label>

      <div class="form-check">

        <input
          class="form-check-input"
          type="radio"
          name="payment"
          value="Cash On Delivery"
          [(ngModel)]="order.payment">

        <label class="form-check-label">

          Cash On Delivery

        </label>

      </div>

      <div class="form-check">

        <input
          class="form-check-input"
          type="radio"
          name="payment"
          value="Online Payment"
          [(ngModel)]="order.payment">

        <label class="form-check-label">

          Online Payment (Razorpay)

        </label>

      </div>

    </div>

    <!-- Button -->

    <button
      class="btn btn-success w-100"
      (click)="checkout()">

      Place Order

    </button>

  </div>

</div>
