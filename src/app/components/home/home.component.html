<section class="hero">

  <div class="container">

    <div class="row align-items-center">

      <!-- Left Side -->
      <div class="col-lg-6">

        <span class="offer">🔥 BIG SALE 2026</span>

        <h1>Discover The Latest Collection</h1>

        <p>
          Shop mobiles, laptops, fashion and electronics at unbeatable prices.
        </p>

        <div class="mt-4">

          <a routerLink="/products" class="btn btn-warning btn-lg me-3">
            Shop Now
          </a>

          <a routerLink="/products" class="btn btn-outline-light btn-lg">
            Explore
          </a>

        </div>

      </div>

      <!-- Right Side -->

      <div class="col-lg-6 text-center">

        <img
          src="/images/hero-image.jpeg"
          class="img-fluid hero-image"
          alt="Hero Image">

      </div>

    </div>

  </div>

</section>

<section class="container my-5">

    <h2 class="fw-bold mb-4 text-center">
        Shop By Category
    </h2>

    <div class="row">

        <div
            class="col-lg-3 col-md-6 mb-4"
            *ngFor="let category of categories">

            <div class="card shadow-sm text-center p-4 category-card">

                <h4>{{category.name}}</h4>

            </div>

        </div>

    </div>

</section>

<!-- featured product -->
 
<app-featured-products></app-featured-products>
