<nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm">

  <div class="container">

    <!-- Logo -->

    <a class="navbar-brand" routerLink="/">

      <img
        src="/images/VELORA (2).png"
        class="logo-img"
        alt="Velora">

    </a>

    <!-- Mobile Toggle -->

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()">

      <span class="navbar-toggler-icon"></span>

    </button>

    <!-- Navbar -->

    <div
      class="navbar-collapse"
      [class.show]="mobileMenuOpen">

      <!-- Left -->

      <ul class="navbar-nav me-auto">

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/"
            (click)="closeMenu()">

            <i class="bi bi-house-door-fill"></i>

            Home

          </a>

        </li>

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/products"
            (click)="closeMenu()">

            <i class="bi bi-grid-fill"></i>

            Products

          </a>

        </li>

      </ul>

      <!-- Search -->

      <form class="d-flex mx-lg-3 search-box">

        <input
          class="form-control"
          type="search"
          placeholder="Search Products">

        <button
          class="btn btn-warning ms-2"
          type="button">

          <i class="bi bi-search"></i>

        </button>

      </form>

      <!-- Right -->

      <ul class="navbar-nav align-items-lg-center">

        <!-- Wishlist -->

        <li
          class="nav-item"
          *ngIf="isLoggedIn()">

          <a
            class="nav-link"
            routerLink="/wishlist"
            (click)="closeMenu()">

            <i class="bi bi-heart-fill"></i>

            Wishlist

          </a>

        </li>

        <!-- Cart -->

        <li
          class="nav-item"
          *ngIf="isLoggedIn()">

          <a
            class="nav-link"
            routerLink="/cart"
            (click)="closeMenu()">

            <i class="bi bi-cart-fill"></i>

            Cart

          </a>

        </li>

        <!-- Register -->

        <li
          class="nav-item"
          *ngIf="!isLoggedIn()">

          <a
            class="nav-link"
            routerLink="/register"
            (click)="closeMenu()">

            Register

          </a>

        </li>

        <!-- Login -->

        <li
          class="nav-item"
          *ngIf="!isLoggedIn()">

          <a
            class="nav-link"
            routerLink="/login"
            (click)="closeMenu()">

            Login

          </a>

        </li>

        <!-- Account -->

        <li
          class="nav-item position-relative"
          *ngIf="isLoggedIn()">

          <a
            class="nav-link account-link"
            href="javascript:void(0)"
            (click)="toggleAccountMenu()">

            <i class="bi bi-person-circle"></i>

            My Account

            <i class="bi bi-chevron-down ms-1"></i>

          </a>

          <!-- Dropdown -->

          <ul
            class="custom-dropdown"
            *ngIf="accountMenuOpen">

            <li>

              <a
                routerLink="/profile"
                (click)="closeDropdown()">

                👤 My Profile

              </a>

            </li>

            <li>

              <a
                routerLink="/orders"
                (click)="closeDropdown()">

                📦 My Orders

              </a>

            </li>

            <li>

              <button
                class="logout-btn"
                (click)="logout()">

                🚪 Logout

              </button>

            </li>

          </ul>

        </li>

      </ul>

    </div>

  </div>

</nav>
