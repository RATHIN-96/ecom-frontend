<div class="container my-5">

    <!-- Search -->

    <div class="row1 mb-4">

        <div class="col-md-6 mx-auto">

            <input
                type="text"
                class="form-control"
                placeholder="🔍 Search Products..."
                [(ngModel)]="searchText"
                (keyup)="searchProducts()">

        </div>

    </div>

    <!-- Category -->

    <div class="row mb-4">

        <div class="col-md-4">

            <select
                class="form-select"
                [(ngModel)]="selectedCategory"
                (change)="categoryChanged()">

                <option value="">All Categories</option>

                <option
                    *ngFor="let category of categories"
                    [value]="category.id">

                    {{ category.name }}

                </option>

            </select>

        </div>

    </div>

    <!-- Price Filter -->

    <div class="row mb-4">

        <div class="col-md-4">

            <select
                class="form-select"
                [(ngModel)]="selectedPrice"
                (change)="priceChanged()">

                <option value="">All Prices</option>

                <option value="1">
                    Under ₹10,000
                </option>

                <option value="2">
                    ₹10,000 - ₹50,000
                </option>

                <option value="3">
                    Above ₹50,000
                </option>

            </select>

        </div>

    </div>

    <!-- Sort -->

    <div class="row mb-4">

        <div class="col-md-4">

            <select
                class="form-select"
                [(ngModel)]="selectedSort"
                (change)="sortChanged()">

                <option value="">
                    Sort By
                </option>

                <option value="low">
                    Price : Low → High
                </option>

                <option value="high">
                    Price : High → Low
                </option>

                <option value="new">
                    Newest
                </option>

            </select>

        </div>

    </div>

    <!-- Products -->

    <div class="row">

        <div
            class="col-lg-4 col-md-6 mb-4"
            *ngFor="let product of products">

            <div class="card h-100 shadow product-card">

                <!-- Image -->

                <div class="position-relative">

                    <img
                        [src]="product.image"
                        class="card-img-top"
                        height="250">

                    <!-- Discount Badge -->

                    <span
                        *ngIf="product.discount_percentage > 0"
                        class="badge bg-danger position-absolute top-0 end-0 m-2 fs-6">

                        {{ product.discount_percentage }}% OFF

                    </span>

                </div>

                <!-- Body -->

                <div class="card-body d-flex flex-column">

                    <!-- Product Name -->

                    <h5 class="fw-bold">

                        {{ product.name }}

                    </h5>

                    <!-- Rating -->

                    <div class="mb-2">

                        <i class="bi bi-star-fill text-warning"></i>

                        <span class="fw-bold">

                            {{ product.average_rating }}

                        </span>

                        <small class="text-muted">

                            ({{ product.review_count }} Reviews)

                        </small>

                    </div>

                    <!-- Price -->

                    <div class="mb-3">

                        <h4 class="text-success fw-bold mb-1">

                            ₹ {{ product.discounted_price }}

                        </h4>

                        <div *ngIf="product.discount_percentage > 0">

                            <span
                                class="text-muted text-decoration-line-through me-2">

                                ₹ {{ product.price }}

                            </span>

                            <small class="text-danger fw-bold">

                                Save {{ product.discount_percentage }}%

                            </small>

                        </div>

                    </div>

                    <!-- Buttons -->

                    <div class="mt-auto d-grid gap-2">

                        <button
                            class="btn btn-outline-primary"
                            (click)="buyNow(product)">

                            ⚡ Buy Now

                        </button>

                        <a
                            [routerLink]="['/products', product.id]"
                            class="btn btn-outline-dark">

                            <i class="bi bi-eye-fill"></i>

                            View Details

                        </a>

                        <button
                            class="btn btn-outline-success"
                            (click)="addToCart(product)">

                            <i class="bi bi-cart-plus-fill"></i>

                            Add To Cart

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
